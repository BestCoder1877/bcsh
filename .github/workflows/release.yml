name: Build and Release
on:
  push:
    branches:
      - master
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain, musl targets, and build-std source
        run: |
          rustup toolchain install nightly
          rustup default nightly
          rustup component add rust-src --toolchain nightly
          rustup target add --toolchain nightly \
            x86_64-unknown-linux-musl \
            i686-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            armv7-unknown-linux-musleabihf \
            arm-unknown-linux-musleabi \
            riscv64gc-unknown-linux-musl \
            powerpc64le-unknown-linux-musl \
            powerpc64-unknown-linux-musl
          mkdir -p /opt/musl
          for target in \
            x86_64-linux-musl \
            i686-linux-musl \
            aarch64-linux-musl \
            arm-linux-musleabi \
            armv7l-linux-musleabihf \
            riscv64-linux-musl \
            mips-linux-musl \
            mipsel-linux-musl \
            powerpc64-linux-musl \
            powerpc64le-linux-musl \
            s390x-linux-musl; do \
            curl -sSL https://musl.cc/${target}-cross.tgz | tar -xz -C /opt/musl --strip-components=1; \
          done
      - name: Build musl binaries
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Build Debian packages
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_COUNT: ${{ github.run_number }}
        run: |
          chmod +x debian-pkg.sh
          ./debian-pkg.sh
      - name: Publish release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v$(date +%Y.%m.%d-%H%M%S)"
          ID=$(curl -s \
            -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Release $TAG\",\"target_commitish\":\"$SHA\"}" |
            grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          for file in output/bcsh-* output/deb/bcsh_*.deb; do
            [ -f "$file" ] || continue
            curl -s \
              -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "$API/repos/$REPO/releases/$ID/assets?name=$(basename "$file")"
          done