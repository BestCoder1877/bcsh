name: Build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install musl cross toolchains
        run: |
          set -e
          mkdir -p /opt/musl /opt/musl/.dl
          for target in \
              x86_64-linux-musl \
              i686-linux-musl \
              aarch64-linux-musl \
              arm-linux-musleabi \
              armv7l-linux-musleabihf \
              riscv64-linux-musl \
              mips-linux-musl \
              mipsel-linux-musl \
              powerpc64-linux-musl \
              powerpc64le-linux-musl \
              s390x-linux-musl \
          ; do \
              curl --retry 3 --retry-all-errors --retry-delay 2 -fSL \
                "https://musl.cc/${target}-cross.tgz" -o "/opt/musl/.dl/${target}.tgz" && \
              tar -xf "/opt/musl/.dl/${target}.tgz" -C /opt/musl --strip-components=1 && \
              rm "/opt/musl/.dl/${target}.tgz"; \
          done && \
          rmdir /opt/musl/.dl && \
          test -x /opt/musl/bin/x86_64-linux-musl-gcc && \
          test -f /opt/musl/x86_64-linux-musl/lib/crt1.o

      - name: Build bcsh (all targets)
        run: PATH="/opt/musl/bin:$PATH" ./build.sh

      - name: Build installer
        run: ./installer/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -e
          TAG=$(git tag --points-at HEAD 2>/dev/null | head -n1)
          [ -z "$TAG" ] && TAG="build-$(git rev-parse --short HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then \
            gh release upload "$TAG" output/bcsh-* installer/output/main-* --clobber; \
          else \
            gh release create "$TAG" output/bcsh-* installer/output/main-* --generate-release-notes; \
          fi