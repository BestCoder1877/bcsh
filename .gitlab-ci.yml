stages:
  - build
  - release

build:
  stage: build
  image: debian:trixie

  before_script:
    - apt-get update
    - apt-get install -y
        cmake
        make
        gcc
        gcc-i686-linux-gnu
        gcc-aarch64-linux-gnu
        gcc-arm-linux-gnueabihf
        gcc-arm-linux-gnueabi
        gcc-riscv64-linux-gnu
        gcc-mips-linux-gnu
        gcc-mipsel-linux-gnu
        gcc-powerpc64-linux-gnu
        gcc-powerpc64le-linux-gnu
        gcc-s390x-linux-gnu
    - chmod +x build.sh

  script:
    - ./build.sh

  artifacts:
    paths:
      - output/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  needs:
    - job: build
      artifacts: true

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"

  script:
    - TAG="v$(date +%Y.%m.%d-%H%M%S)"
    - git tag "$TAG"
    - git push origin "$TAG"
    - glab release create "$TAG" output/bcsh-* --name "$TAG" --notes "Release $TAG"
