name: Build and Release
on:
  push:
    branches:
      - master
jobs:
  release:
    runs-on: run
    container:
      image: bcsh-builder
    steps:
      - uses: actions/checkout@v4
      - name: Build musl binaries
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Build Debian packages
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_COUNT: ${{ github.run_number }}
        run: |
          chmod +x debian-pkg.sh
          ./debian-pkg.sh
      - name: Publish rolling release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          TAG="rolling"
          curl -s \
            -X DELETE \
            -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/releases/tags/$TAG" || true
          ID=$(curl -s \
            -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Rolling\",\"body\":\"Automated rolling build of commit $(git rev-parse --short HEAD).\",\"target_commitish\":\"master\"}" |
            grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          for file in output/deb/bcsh_*.deb; do
            [ -f "$file" ] || continue
            curl -s \
              -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "$API/repos/$REPO/releases/$ID/assets?name=$(basename "$file")"
          done