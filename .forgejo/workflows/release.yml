name: Build and Release
on:
  push:
    branches:
      - master
jobs:
  release:
    runs-on: run
    container:
      image: bcsh-builder
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x build.sh
          ./build.sh
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v$(date +%Y.%m.%d-%H%M%S)"
          ID=$(curl -s \
            -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Release $TAG\",\"target_commitish\":\"$SHA\"}" |
            grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          for file in output/bcsh-*; do
            [ -f "$file" ] || continue
            curl -s \
              -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "$API/repos/$REPO/releases/$ID/assets?name=$(basename "$file")"
          done
